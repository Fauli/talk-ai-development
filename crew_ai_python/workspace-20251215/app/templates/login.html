{% extends "base.html" %}

{% block title %}Login - PixelPet{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-tabs">
        <button class="auth-tab active" onclick="showTab('login')">Login</button>
        <button class="auth-tab" onclick="showTab('register')">Register</button>
    </div>
    
    <div id="login-form" class="auth-form active">
        <h2>Welcome Back!</h2>
        <p>Login to care for your pet</p>
        
        <form method="post" action="/login">
            <div class="form-group">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
    
    <div id="register-form" class="auth-form">
        <h2>Join PixelPet!</h2>
        <p>Create an account to adopt your first pet</p>
        
        <form method="post" action="/register">
            <div class="form-group">
                <label for="register-email">Email:</label>
                <input type="email" id="register-email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="register-password">Password:</label>
                <input type="password" id="register-password" name="password" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>
    </div>
</div>

<script>
function showTab(tabName) {
    // Hide all forms
    document.querySelectorAll('.auth-form').forEach(form => {
        form.classList.remove('active');
    });
    
    // Hide all tab buttons
    document.querySelectorAll('.auth-tab').forEach(tab => {
        tab.classList.remove('active');
    });
    
    // Show selected form
    document.getElementById(tabName + '-form').classList.add('active');
    
    // Show selected tab
    event.target.classList.add('active');
}
</script>
{% endblock %}
