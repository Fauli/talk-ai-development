<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PixelPet{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <a href="/">🐾 PixelPet</a>
            </h1>
            <nav class="nav">
                {% if request.cookies.get('access_token') %}
                    <a href="/game" class="nav-link">My Pet</a>
                    <a href="/logout" class="nav-link">Logout</a>
                {% else %}
                    <a href="/login" class="nav-link">Login</a>
                {% endif %}
            </nav>
        </div>
    </header>
    
    <main class="main">
        <div class="container">
            {% if error %}
                <div class="alert alert-error">
                    {{ error }}
                </div>
            {% endif %}
            
            {% if message %}
                <div class="alert alert-success">
                    {{ message }}
                </div>
            {% endif %}
            
            {% block content %}{% endblock %}
        </div>
    </main>
    
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 PixelPet - Take care of your virtual companion!</p>
        </div>
    </footer>
    
    <script src="{{ url_for('static', path='js/pet.js') }}"></script>
</body>
</html>
