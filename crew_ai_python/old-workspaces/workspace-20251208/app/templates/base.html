<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PixelPet{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="pixel-title">🦎 PixelPet 🦎</h1>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>
            <p class="pixel-text">Take care of your virtual pet! ✨</p>
        </footer>
    </div>
    <script src="{{ url_for('static', path='/js/pet.js') }}"></script>
</body>
</html>
