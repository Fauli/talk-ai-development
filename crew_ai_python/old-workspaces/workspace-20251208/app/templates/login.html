{% extends "base.html" %}

{% block title %}PixelPet - Login{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-form">
        <h2 class="pixel-subtitle">Welcome to PixelPet!</h2>

        {% if error %}
        <div class="error-message" style="background: #f8d7da; border: 2px solid #dc3545; padding: 10px; margin-bottom: 15px; font-size: 10px;">
            {{ error }}
        </div>
        {% endif %}

        <div class="tab-container">
            <button class="tab-button active" onclick="showLogin()">Login</button>
            <button class="tab-button" onclick="showRegister()">Register</button>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="form-container">
            <form action="/login" method="post">
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit" class="pixel-button">Login</button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="form-container" style="display: none;">
            <form action="/register" method="post">
                <div class="form-group">
                    <label for="register-email">Email:</label>
                    <input type="email" id="register-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password:</label>
                    <input type="password" id="register-password" name="password" required>
                </div>
                <button type="submit" class="pixel-button">Register</button>
            </form>
        </div>
    </div>
</div>

<script>
function showLogin() {
    document.getElementById('login-form').style.display = 'block';
    document.getElementById('register-form').style.display = 'none';
    document.querySelectorAll('.tab-button')[0].classList.add('active');
    document.querySelectorAll('.tab-button')[1].classList.remove('active');
}

function showRegister() {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('register-form').style.display = 'block';
    document.querySelectorAll('.tab-button')[0].classList.remove('active');
    document.querySelectorAll('.tab-button')[1].classList.add('active');
}
</script>
{% endblock %}
